[package]
name = "pmp-deploy-plugin-sdk"
version = "0.1.0"
edition = "2024"
description = "SDK for creating pmp-deploy infrastructure plugins"
license = "MIT"
repository = "https://github.com/yourusername/pmp-deploy"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
