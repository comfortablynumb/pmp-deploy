# Kubernetes - App-Only Deployment Example
# This configuration demonstrates deploying application updates to Kubernetes
# without modifying cluster infrastructure (using kubectl directly).

infrastructure:
  k8s-production:
    type: kubernetes
    config:
      context: production-cluster
      namespace: production
      kubeconfig: ~/.kube/config

  k8s-staging:
    type: kubernetes
    config:
      context: staging-cluster
      namespace: staging
      kubeconfig: ~/.kube/config

environments:
  # Staging - rolling update for safe deployments
  staging:
    infrastructure: k8s-staging
    deployment_type: rolling-update
    image: registry.example.com/myapp:staging
    replicas: 2
    resources:
      cpu: "250m"
      memory: "256Mi"
      cpu_limit: "500m"
      memory_limit: "512Mi"
    config:
      batch_size: 50
      health_check_timeout_secs: 120
    env:
      NODE_ENV: staging
      LOG_LEVEL: debug

  # Production - rolling update with conservative batches
  production:
    infrastructure: k8s-production
    deployment_type: rolling-update
    image: registry.example.com/myapp:v1.0.0
    replicas: 5
    resources:
      cpu: "500m"
      memory: "512Mi"
      cpu_limit: "1000m"
      memory_limit: "1Gi"
    config:
      batch_size: 20
      health_check_timeout_secs: 300
      rollback_on_failure: true
    env:
      NODE_ENV: production
      LOG_LEVEL: warn

  # Canary environment - small subset for testing new versions
  canary:
    infrastructure: k8s-production
    deployment_type: rolling-update
    image: registry.example.com/myapp:v1.1.0-rc1
    replicas: 1
    resources:
      cpu: "500m"
      memory: "512Mi"
    config:
      batch_size: 100
    env:
      NODE_ENV: production
      LOG_LEVEL: info
      CANARY: "true"
